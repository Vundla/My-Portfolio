# Fly.io Configuration for Enterprise Frontend  
# fly.frontend.toml

app = "codex-sanctium"
primary_region = "jnb"  # Johannesburg

[build]
  dockerfile = "./frontend/Dockerfile"

[env]
  NODE_ENV = "production"
  
  # API endpoints (using Fly.io URLs - no custom domain needed)
  VITE_API_URL = "https://codex-sanctium-api.fly.dev"
  VITE_SIGNALR_URL = "https://codex-sanctium-api.fly.dev/api/hub"
  
  # GitHub integration
  VITE_GITHUB_PROFILE = "https://github.com/Vundla" 
  VITE_GITHUB_REPO = "https://github.com/Vundla/My-Portfolio"
  
  # Enterprise branding
  VITE_APP_NAME = "Codex Sanctium"
  VITE_APP_DESCRIPTION = "Enterprise AI Portfolio"

[http_service]
  internal_port = 5173
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  method = "get"
  path = "/"
  protocol = "http"
  timeout = "10s"
  interval = "30s"
  grace_period = "5s"

# Static file optimization
[[http_service.http_options]]
  response.headers."cache-control" = "public, max-age=31536000, immutable"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared" 
  cpus = 1