apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-frontend
  labels:
    app: codex-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codex-frontend
  template:
    metadata:
      labels:
        app: codex-frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: codex/frontend:k8s
        ports:
        - containerPort: 5173
        env:
        - name: NODE_ENV
          value: "production"
        - name: VITE_API_URL
          value: "http://codex-backend-service:5000"
        - name: VITE_SIGNALR_URL
          value: "http://codex-backend-service:5000/api/hub"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 5173
          initialDelaySeconds: 10
          periodSeconds: 10
        # Enterprise security
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: codex-frontend-service
  labels:
    app: codex-frontend
spec:
  selector:
    app: codex-frontend
  ports:
  - port: 80
    targetPort: 5173
    protocol: TCP
    name: http
  type: NodePort
---
# Frontend HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codex-frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codex-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60