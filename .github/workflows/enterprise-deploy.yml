name: 🚀 Enterprise CI/CD - Codex Sanctium

on:
  push:
    branches: [ main, codex_sanctium ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🔍 Code Quality & Security
  quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Checkout
        uses: actions/checkout@v4
        
      - name: 🔷 Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: 🔍 .NET Code Analysis
        run: |
          cd backend
          dotnet restore
          dotnet format --verify-no-changes --verbosity diagnostic
          dotnet build --no-restore --configuration Release
          
      - name: 🔍 Frontend Linting
        run: |
          cd frontend
          npm ci
          npm run lint || echo "Linting warnings found"
          npm run check
          
      - name: 🛡️ Security Scan
        uses: github/super-linter/slim@v4
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_TYPESCRIPT: true
          VALIDATE_JAVASCRIPT: true
          VALIDATE_JSON: true
          VALIDATE_DOCKERFILE: true

  # 🧪 Testing Pipeline  
  test:
    name: 🧪 Testing
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        dotnet-version: ['8.0.x']
        node-version: ['20.x']
        
    steps:
      - name: 📋 Checkout
        uses: actions/checkout@v4
        
      - name: 🔷 Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
          
      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: 🧪 Backend Tests
        run: |
          cd backend
          dotnet restore
          dotnet build --no-restore
          dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage"
          
      - name: 🧪 Frontend Tests
        run: |
          cd frontend
          npm ci
          npm run build
          npm run test || echo "Tests not implemented yet"
          
      - name: 📊 Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          directory: backend/TestResults
          flags: backend
          
  # 🏗️ Build Images
  build:
    name: 🏗️ Build & Push Images
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex_sanctium'
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: 📋 Checkout
        uses: actions/checkout@v4
        
      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: 🔑 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🏗️ Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Codex Sanctium Backend
            org.opencontainers.image.description=Enterprise .NET 8 Backend API
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            
      - name: 🏗️ Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Codex Sanctium Frontend
            org.opencontainers.image.description=Enterprise Svelte Frontend
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

  # 🚀 Deploy to Production
  deploy:
    name: 🚀 Deploy to ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: 
      name: ${{ inputs.environment || 'staging' }}
      url: https://codex-sanctium.fly.dev
      
    steps:
      - name: 📋 Checkout
        uses: actions/checkout@v4
        
      - name: 🚀 Deploy to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: 🚀 Deploy Backend
        run: |
          echo "Deploying backend to ${{ inputs.environment || 'staging' }}"
          # flyctl deploy --config fly.backend.toml
          
      - name: 🚀 Deploy Frontend  
        run: |
          echo "Deploying frontend to ${{ inputs.environment || 'staging' }}"
          # flyctl deploy --config fly.frontend.toml
          
      - name: 🎉 Deployment Complete
        run: |
          echo "🎉 Codex Sanctium deployed to ${{ inputs.environment || 'staging' }}!"
          echo "🔗 Backend: https://api-codex-sanctium.fly.dev"
          echo "🔗 Frontend: https://codex-sanctium.fly.dev"
          
      - name: 📊 Update Status
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: 'https://codex-sanctium.fly.dev',
              description: 'Deployed to ${{ inputs.environment || "staging" }}',
              context: 'deploy/${{ inputs.environment || "staging" }}'
            })